<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#fffdf9" />
  <title>김태형 ♥ 이채연 결혼합니다</title>
  <meta property="og:type" content="website" />
  <meta property="og:title" content="김태형 ♥ 이채연 결혼합니다" />
  <meta property="og:description" content="2026.12.05 베뉴비안 웨딩홀" />
  <meta property="og:image" content="https://smijqljrxhafvizonqui.supabase.co/storage/v1/object/public/wedding-images/99c98f89-3a57-4dd8-8daa-3910620f3c67/cover/1786888651167-77d51957-5fae-4cbd-9af6-d1bf618ac705.png" />
  <meta property="og:url" content="https://duringbbi.github.io/Wedding/" />
  <link rel="canonical" href="https://duringbbi.github.io/Wedding/" />
  <style>
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fffdf9;font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Apple SD Gothic Neo",sans-serif}
    #site{position:fixed;inset:0;width:100%;height:100dvh;border:0;background:#fffdf9}
    .shareDock{position:fixed;z-index:9999;right:max(14px,env(safe-area-inset-right));bottom:max(18px,calc(env(safe-area-inset-bottom) + 14px));display:flex;flex-direction:column;align-items:flex-end;gap:8px}
    .shareBtn{border:0;border-radius:999px;background:#FEE500;color:#191919;padding:13px 17px;font-size:13px;font-weight:800;box-shadow:0 8px 24px rgba(0,0,0,.18);display:flex;align-items:center;gap:7px;cursor:pointer}
    .shareBtn:active{transform:scale(.98)}
    .toast{max-width:calc(100vw - 32px);padding:9px 12px;border-radius:999px;background:rgba(35,31,28,.92);color:white;font-size:11px;opacity:0;transform:translateY(6px);transition:.2s;pointer-events:none}.toast.show{opacity:1;transform:translateY(0)}
    .fallback{position:fixed;inset:0;display:none;place-items:center;padding:28px;text-align:center;background:#fffdf9;color:#6e6259;z-index:20}.fallback.show{display:grid}.fallback a{display:inline-block;margin-top:14px;padding:12px 16px;border-radius:12px;background:#8c6f5e;color:white;text-decoration:none;font-weight:700}
  </style>
  <script src="https://t1.kakaocdn.net/kakao_js_sdk/2.8.1/kakao.min.js" integrity="sha384-OL+ylM/iuPLtW5U3XcvLSGhE8JzReKDank5InqlHGWPhb4140/yrBw0bg0y7+C9J" crossorigin="anonymous"></script>
  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.111.0/+esm';
    const SUPABASE_URL='https://smijqljrxhafvizonqui.supabase.co';
    const SUPABASE_KEY='sb_publishable_RLdYeKWJz2HixpCThdqVTg_TtSmH4H9';
    const KAKAO_KEY='ff86439aeba2d4f60d8ff3fa249b2911';
    const SHARE_URL='https://duringbbi.github.io/Wedding/';
    const FALLBACK_TITLE='김태형 ♥ 이채연 결혼합니다';
    const FALLBACK_DESCRIPTION='2026.12.05 베뉴비안 웨딩홀';
    const FALLBACK_IMAGE='https://smijqljrxhafvizonqui.supabase.co/storage/v1/object/public/wedding-images/99c98f89-3a57-4dd8-8daa-3910620f3c67/cover/1786888651167-77d51957-5fae-4cbd-9af6-d1bf618ac705.png';
    const sb=createClient(SUPABASE_URL,SUPABASE_KEY);
    let share={title:FALLBACK_TITLE,description:FALLBACK_DESCRIPTION,image:FALLBACK_IMAGE};
    const toast=(text)=>{const el=document.getElementById('toast');el.textContent=text;el.classList.add('show');clearTimeout(window.__toast);window.__toast=setTimeout(()=>el.classList.remove('show'),2400)};
    async function loadShare(){
      const {data,error}=await sb.from('wedding').select('share_title,share_description,share_image_url,use_cover_as_share_image,cover_image_url').eq('slug','taehyung-chaeyeon').single();
      if(error||!data)return;
      share.title=data.share_title||FALLBACK_TITLE;
      share.description=data.share_description||FALLBACK_DESCRIPTION;
      share.image=(data.use_cover_as_share_image?data.cover_image_url:(data.share_image_url||data.cover_image_url))||FALLBACK_IMAGE;
    }
    function initKakao(){
      try{if(!window.Kakao)return false;if(!Kakao.isInitialized())Kakao.init(KAKAO_KEY);return Kakao.isInitialized()}catch(e){console.error(e);return false}
    }
    window.addEventListener('DOMContentLoaded',async()=>{
      await loadShare();
      document.getElementById('shareBtn').addEventListener('click',()=>{
        if(!initKakao()){toast('카카오 공유 설정을 확인해 주세요.');return;}
        Kakao.Share.sendDefault({objectType:'feed',content:{title:share.title,description:share.description,imageUrl:share.image,link:{mobileWebUrl:SHARE_URL,webUrl:SHARE_URL}},buttonTitle:'청첩장 보기'}).catch(e=>{console.error(e);toast('카카오톡 공유 중 문제가 발생했습니다.')});
      });
      const frame=document.getElementById('site');
      const timer=setTimeout(()=>document.getElementById('fallback').classList.add('show'),10000);
      frame.addEventListener('load',()=>clearTimeout(timer),{once:true});
    });
  </script>
</head>
<body>
  <iframe id="site" src="https://taehyung-chaeyeon-wedding-v17-test-bb62u33bz.vercel.app/" title="김태형 이채연 모바일 청첩장" allow="clipboard-write; web-share"></iframe>
  <div class="shareDock">
    <div id="toast" class="toast"></div>
    <button id="shareBtn" class="shareBtn" type="button">💬 카카오톡 공유</button>
  </div>
  <div id="fallback" class="fallback">
    <div>청첩장을 불러오는 데 시간이 걸리고 있습니다.<br><a href="https://taehyung-chaeyeon-wedding-v17-test-bb62u33bz.vercel.app/">청첩장 바로 열기</a></div>
  </div>
</body>
</html>
