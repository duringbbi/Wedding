<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f6f1eb"><meta property="og:type" content="website"><meta property="og:title" content="김태형 ♥ 이채연 결혼합니다"><meta property="og:description" content="2026.12.05 베뉴비안 웨딩홀"><meta property="og:image" content="https://smijqljrxhafvizonqui.supabase.co/storage/v1/object/public/wedding-images/99c98f89-3a57-4dd8-8daa-3910620f3c67/share/1786898417098-a2ee868b-b7e2-49bf-bbd9-36a38bd10243.jpg"><meta property="og:url" content="https://duringbbi.github.io/Wedding/"><link rel="canonical" href="https://duringbbi.github.io/Wedding/"><title>김태형 ♥ 이채연 결혼합니다</title><link rel="stylesheet" href="./app.css?v=2"><link rel="stylesheet" href="./hero-effects.css?v=5"><link rel="stylesheet" href="./interaction-enhancements.css?v=1"><link rel="stylesheet" href="./lightbox-square.css?v=1"><link rel="stylesheet" href="./bgm.css?v=1"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.111.0/dist/umd/supabase.min.js"></script></head><body>
<div id="loading" class="loading">청첩장을 불러오는 중입니다.</div><main id="app" class="shell hidden">
<section class="hero"><img id="coverImage" alt="웨딩 메인 사진"><div class="heroHandwriting" aria-hidden="true"><svg viewBox="0 0 410 100" preserveAspectRatio="xMidYMid meet"></svg></div><div class="heroCopy"><div class="kicker">OUR WEDDING DAY</div><h1><span id="heroGroom"></span><em>and</em><span id="heroBride"></span></h1><div id="heroMeta" class="heroMeta"></div></div></section>
<section class="section greeting"><div class="eyebrow">INVITATION</div><h2>초대합니다</h2><div id="greetingText" class="greetingCopy"></div><div id="coupleTitle" style="text-align:center;margin-top:26px;font-weight:700"></div><div class="people"><div class="card"><small>GROOM</small><strong id="groomName"></strong><div class="pills"><a id="groomCall">전화</a><a id="groomSms">문자</a></div></div><div class="card"><small>BRIDE</small><strong id="brideName"></strong><div class="pills"><a id="brideCall">전화</a><a id="brideSms">문자</a></div></div></div><details id="parentsDetails" class="details hidden"><summary>혼주 연락처</summary><div id="parentsWrap"></div></details></section>
<section class="section gallery"><div class="eyebrow">OUR MOMENTS</div><h2>갤러리</h2><div id="galleryGrid" class="galleryGrid"></div><button id="galleryMore" class="galleryMore hidden" type="button"></button></section>
<section class="section"><div class="eyebrow">WEDDING DAY</div><h2 id="dateTitle"></h2><div class="datePanel"><div id="monthText" class="month"></div><div id="dayText" class="day"></div><div id="dateMeta" class="dateMeta"></div><div id="dday" class="dday"></div><button id="calendarBtn" class="outline wide" type="button">캘린더에 저장</button></div></section>
<section class="section location"><div class="eyebrow">LOCATION</div><h2>오시는 길</h2><div class="locationCard"><iframe id="mapFrame" loading="lazy"></iframe><div class="locationBody"><strong id="venueName"></strong><p id="venueAddress"></p><div class="mapActions" style="grid-template-columns:repeat(3,1fr)"><a id="copyAddress" href="javascript:void(0)">주소 복사</a><a id="naverMap" target="_blank" rel="noopener">네이버지도</a><a id="kakaoMap" target="_blank" rel="noopener">카카오맵</a></div><div class="transport"><div><b>지하철</b><span id="subwayText"></span></div><div id="busRow"><b>버스</b><span id="busText"></span></div><div><b>주차</b><span id="parkingText"></span></div></div></div></div></section>
<section class="section rsvp"><div class="eyebrow">RSVP</div><h2>참석 여부 전달</h2><form id="rsvpForm" class="form"><label>성함<input name="name" required maxlength="50"></label><label>구분<select name="side" required><option value="신랑측">신랑측</option><option value="신부측">신부측</option></select></label><label>참석 여부<select id="attendanceSelect" name="attendance" required><option value="참석">참석</option><option value="불참">불참</option></select></label><label id="guestCountField">참석 인원<input name="guest_count" type="number" min="1" max="20" value="1"></label><label id="mealField">식사 여부<select name="meal"><option value="예정">예정</option><option value="미정">미정</option><option value="하지 않음">하지 않음</option></select></label><label>전달사항<textarea name="message" maxlength="500"></textarea></label><button id="rsvpSubmit" class="primary" type="submit">참석 여부 전달하기</button><div id="rsvpStatus" class="status"></div></form><div id="rsvpResult" class="rsvpResult hidden"><div class="check">✓</div><strong>참석 여부가 전달되었습니다</strong><p id="rsvpResultText"></p></div></section>
<section id="accountSection" class="section"><div class="eyebrow">ACCOUNT</div><h2>마음 전하실 곳</h2><div id="groomAccountRow" class="details"><div class="account"><div id="groomAccountText"></div><button id="groomCopy" type="button">복사</button></div></div><div id="brideAccountRow" class="details"><div class="account"><div id="brideAccountText"></div><button id="brideCopy" type="button">복사</button></div></div></section>
<section class="section guestbook"><div class="eyebrow">GUESTBOOK</div><h2>방명록</h2><form id="guestForm" class="form"><label>성함<input name="name" required maxlength="50"></label><label>축하 메시지<textarea name="message" required maxlength="500"></textarea></label><button id="guestSubmit" class="primary" type="submit">방명록 남기기</button><div id="guestStatus" class="status"></div></form><div class="guestWall"><div class="guestWallHead"><div><small>FROM OUR GUESTS</small><strong>하객들이 남긴 축하 메시지</strong></div><span id="guestCount" class="guestCount"></span></div><div id="guestList" class="guestList"></div><button id="guestMore" class="guestMore hidden" type="button"></button></div></section>
<footer><p>소중한 날,<br>함께해 주세요.</p><div class="shareActions"><button id="copyShareBtn" class="copyShare" type="button">링크 복사</button></div></footer></main><div id="lightbox" class="lightbox"><button id="lightboxClose" type="button">×</button><img id="lightboxImage" alt="확대 사진"></div><div id="toast" class="toast"></div><script src="./app.js?v=4"></script><script src="./hero-settings.js?v=3"></script><script src="./interaction-enhancements.js?v=2"></script><script src="./bgm.js?v=2"></script></body></html>
