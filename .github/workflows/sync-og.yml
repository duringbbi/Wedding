name: Sync Wedding OG Metadata

on:
  push:
    paths:
      - '.github/workflows/sync-og.yml'
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-wedding-og
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch current share settings
        env:
          SUPABASE_URL: https://smijqljrxhafvizonqui.supabase.co
          SUPABASE_KEY: sb_publishable_RLdYeKWJz2HixpCThdqVTg_TtSmH4H9
        run: |
          curl --fail --silent --show-error \
            "$SUPABASE_URL/rest/v1/wedding?slug=eq.taehyung-chaeyeon&select=share_title,share_description,share_image_url,use_cover_as_share_image,cover_image_url" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Accept: application/json" > /tmp/wedding.json
          test "$(jq 'length' /tmp/wedding.json)" -eq 1

      - name: Update Open Graph metadata
        run: |
          python3 - <<'PY'
          import json, html, re
          from pathlib import Path

          data = json.loads(Path('/tmp/wedding.json').read_text())[0]
          title = data.get('share_title') or '김태형 ♥ 이채연 결혼합니다'
          desc = data.get('share_description') or '2026.12.05 베뉴비안 웨딩홀'
          image = (data.get('cover_image_url') if data.get('use_cover_as_share_image') else data.get('share_image_url')) or data.get('cover_image_url') or ''

          p = Path('index.html')
          text = p.read_text()
          def esc(v): return html.escape(str(v), quote=True)
          def meta(prop, value, src):
              pattern = rf'<meta property="{re.escape(prop)}" content="[^"]*">'
              repl = f'<meta property="{prop}" content="{esc(value)}">'
              if re.search(pattern, src):
                  return re.sub(pattern, repl, src, count=1)
              return src.replace('</head>', repl + '</head>', 1)

          text = meta('og:title', title, text)
          text = meta('og:description', desc, text)
          text = meta('og:image', image, text)
          text = meta('og:url', 'https://duringbbi.github.io/Wedding/', text)
          text = re.sub(r'<title>.*?</title>', f'<title>{esc(title)}</title>', text, count=1, flags=re.S)
          p.write_text(text)
          PY

      - name: Commit metadata change
        run: |
          if git diff --quiet -- index.html; then
            echo "OG metadata already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Sync wedding share preview metadata"
          git push
