<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>고객 계정 연결</title><link rel="stylesheet" href="../app.css?v=2"><style>
.accessWrap{max-width:980px;margin:0 auto;padding:28px 18px 70px}.accessHead{display:flex;justify-content:space-between;gap:14px;align-items:flex-start;margin-bottom:22px}.accessList{display:grid;gap:14px}.accessCard{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px}.accessCard h2{margin:0 0 5px}.accessMeta{font-size:12px;color:var(--muted);margin-bottom:14px}.memberList{display:grid;gap:8px;margin:12px 0}.memberRow{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 12px;border-radius:12px;background:#f8f5f2}.memberInfo{min-width:0}.memberInfo b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.memberInfo small{color:var(--muted)}.memberActions{display:flex;gap:6px;align-items:center}.connectForm{display:grid;grid-template-columns:1fr 130px auto;gap:8px;margin-top:12px}.accessEmpty{padding:34px;text-align:center;border:1px dashed var(--line);border-radius:16px;color:var(--muted);background:#fff}.accessLogin{width:min(430px,calc(100% - 36px));margin:70px auto;background:#fff;border:1px solid var(--line);border-radius:20px;padding:24px}.hidden{display:none!important}@media(max-width:700px){.accessHead{display:block}.accessHead .actions{margin-top:12px}.connectForm{grid-template-columns:1fr}.memberRow{align-items:flex-start;flex-direction:column}.memberActions{width:100%}}
