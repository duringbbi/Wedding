<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>내 청첩장 관리</title><link rel="stylesheet" href="../admin/app.css?v=2"><style>
:root{--manage-bg:#f7f4f1;--manage-card:#fff;--manage-line:#e7dfd8;--manage-text:#2e2926;--manage-muted:#7c736d}.manageShell{max-width:1080px;margin:0 auto;padding:30px 18px 70px}.manageHead{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;margin-bottom:24px}.manageHead h1{margin:0 0 6px}.manageActions{display:flex;gap:8px;flex-wrap:wrap}.manageCards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.manageCard{background:#fff;border:1px solid var(--manage-line);border-radius:18px;padding:18px}.manageCard h2{margin:0 0 8px;font-size:20px}.manageMeta{font-size:13px;color:var(--manage-muted);line-height:1.7;margin:12px 0}.manageBtns{display:flex;gap:8px;flex-wrap:wrap}.manageEmpty{background:#fff;border:1px dashed var(--manage-line);border-radius:18px;padding:36px;text-align:center;color:var(--manage-muted);line-height:1.8}.manageLogin{width:min(430px,calc(100% - 36px));margin:70px auto;background:#fff;border:1px solid var(--manage-line);border-radius:20px;padding:24px}.manageLogin h1{margin-top:0}.authTabs{display:flex;gap:8px;margin-bottom:18px}.authTabs button{flex:1}.authPane.hidden{display:none}.manageRole{display:inline-block;padding:5px 9px;border-radius:999px;background:#f1ece7;color:#6a5d54;font-size:11px;font-weight:800}.manageBack{margin-bottom:14px}.hidden{display:none!important}@media(max-width:760px){.manageHead{display:block}.manageActions{margin-top:14px}.manageCards{grid-template-columns:1fr}}
</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.111.0/dist/umd/supabase.min.js"></script></head><body>
<div id="manageLogin" class="manageLogin hidden"><h1>내 청첩장 관리</h1><p class="note">본인에게 연결된 청첩장만 확인하고 수정할 수 있습니다.</p><div class="authTabs"><button id="showLogin" class="btn primary" type="button">로그인</button><button id="showSignup" class="btn ghost" type="button">회원가입</button></div><form id="loginForm" class="authPane"><div class="field"><label>이메일</label><input name="email" type="email" required></div><div class="field"><label>비밀번호</label><input name="password" type="password" required></div><button class="btn primary" style="width:100%">로그인</button><div id="loginStatus" class="status"></div></form><form id="signupForm" class="authPane hidden"><div class="field"><label>이메일</label><input name="email" type="email" required></div><div class="field"><label>비밀번호</label><input name="password" type="password" minlength="8" required></div><button class="btn primary" style="width:100%">회원가입</button><div class="guide">가입 후 전체관리자가 이 이메일을 청첩장에 연결하면 관리할 수 있습니다.</div><div id="signupStatus" class="status"></div></form></div>
<div id="manageHome" class="manageShell hidden"><div class="manageHead"><div><h1>내 청첩장</h1><div id="manageWho" class="note"></div></div><div class="manageActions"><button id="manageRefresh" class="btn ghost">새로고침</button><button id="manageLogout" class="btn ghost">로그아웃</button></div></div><div id="manageCards" class="manageCards"></div></div>
<div id="editorHost"></div>
<script src="./manage.js?v=1"></script></body></html>
